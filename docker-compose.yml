version: "3.9"

services:
  db:
    image: postgres:15
    container_name: delta_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delta_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_to_a_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-delta_trading}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delta_bot} -d ${POSTGRES_DB:-delta_trading}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bot_network

  bot:
    build: .
    container_name: delta_trading_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ACTIVE_STRATEGY=${ACTIVE_STRATEGY:-ema_crossover_rsi}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
    volumes:
      - ./logs:/app/logs
    networks:
      - bot_network

volumes:
  pgdata:
    driver: local

networks:
  bot_network:
    driver: bridge
